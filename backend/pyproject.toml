[project]
name = "airrag"
version = "0.1.0"
description = "Lightweight Multimodal RAG as a Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "google-genai>=1.74.0",
    "llama-index-core>=0.14.21",
    "markitdown[docx,pdf,pptx]>=0.1.5",
    "uvicorn[standard]>=0.34.0",
    "qdrant-client>=1.9.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "minio>=7.2.0",
    "pypdf>=4.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
